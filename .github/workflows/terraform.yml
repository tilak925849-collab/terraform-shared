name: terraform

# PR            -> lint, validate, security scan and plan every changed stack; plan is posted on the PR.
# push to main  -> plan again, then apply that exact plan after the environment's approval gate.
# manual run    -> plan / apply / destroy one stack.

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "projects/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack directory, e.g. projects/golden-hour-code/dev"
        required: true
        default: projects/golden-hour-code/dev
      action:
        description: "What to run"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

env:
  TF_VERSION: 1.12.2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  detect:
    name: detect changed stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.find.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: find
        env:
          EVENT: ${{ github.event_name }}
          INPUT_STACK: ${{ inputs.stack }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # A stack is any projects/<project>/<env>/ directory that has a main.tf.
          all_stacks() { find projects -mindepth 3 -maxdepth 3 -name main.tf -printf '%h\n' | sort -u; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            stack="${INPUT_STACK%/}"
            if [[ ! "$stack" =~ ^projects/[^/]+/[^/]+$ ]] || [ ! -f "$stack/main.tf" ]; then
              echo "::error::'$stack' is not a stack directory (projects/<project>/<env> with a main.tf)"
              exit 1
            fi
            stacks="$stack"
          else
            base="$PUSH_BEFORE"
            [ "$EVENT" = "pull_request" ] && base="$PR_BASE"

            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              stacks="$(all_stacks)"
            else
              changed="$(git diff --name-only "$base" HEAD)"
              if grep -qE '^(\.github/workflows/terraform\.yml|\.tflint\.hcl)$' <<<"$changed"; then
                # Pipeline or lint config changed: re-check every stack.
                stacks="$(all_stacks)"
              else
                stacks="$(grep -E '^projects/[^/]+/[^/]+/' <<<"$changed" | cut -d/ -f1-3 | sort -u \
                  | while read -r d; do if [ -f "$d/main.tf" ]; then echo "$d"; fi; done || true)"
              fi
            fi
          fi

          json="$(printf '%s\n' "$stacks" | jq -R -s -c '
            split("\n") | map(select(length > 0))
            | map({dir: ., env: (split("/")[2]), slug: gsub("/"; "-")})')"
          echo "Stacks: $json"
          echo "stacks=$json" >> "$GITHUB_OUTPUT"

  plan:
    name: plan ${{ matrix.dir }}
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC to AWS
      pull-requests: write  # plan comment
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.stacks) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ matrix.dir }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: terraform validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}  # avoids rate limits when downloading plugins
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.dir }}
          framework: terraform
          download_external_modules: true
          quiet: true
          soft_fail: true  # report only; set to false once the baseline is clean

      - name: terraform plan
        id: plan
        env:
          DESTROY: ${{ inputs.action == 'destroy' && '-destroy' || '' }}
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan $DESTROY
          code=$?
          set -e
          # 0 = no changes, 1 = error, 2 = changes
          [ "$code" -eq 1 ] && exit 1
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Plan: \`${{ matrix.dir }}\`"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.slug }}
          path: ${{ matrix.dir }}/tfplan
          retention-days: 5

      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          STACK: ${{ matrix.dir }}
          HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
        with:
          script: |
            const fs = require('fs');
            const stack = process.env.STACK;
            const marker = `<!-- tf-plan:${stack} -->`;
            let plan = fs.readFileSync(`${stack}/plan.txt`, 'utf8');
            const max = 60000;
            if (plan.length > max) plan = '...(truncated, see the job summary)\n' + plan.slice(-max);
            const status = process.env.HAS_CHANGES === 'true' ? 'changes pending' : 'no changes';
            const body = [
              marker,
              `### Terraform plan: \`${stack}\` (${status})`,
              `<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`,
              `_Run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) at ${context.sha.substring(0, 7)}_`,
            ].join('\n\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    name: ${{ inputs.action == 'destroy' && 'destroy' || 'apply' }} ${{ matrix.dir }}
    needs: [detect, plan]
    # Only from main: on merge, or a manual apply/destroy.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.action != 'plan'))
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}  # approval gate + env-scoped AWS role
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.stacks) }}
    concurrency:
      group: terraform-apply-${{ matrix.slug }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ matrix.dir }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.slug }}
          path: ${{ matrix.dir }}

      # Applies exactly what was reviewed. Terraform rejects the plan if state changed since.
      - name: terraform apply
        run: terraform apply -no-color tfplan

      - name: outputs
        run: terraform output -no-color
